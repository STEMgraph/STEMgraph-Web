services:
  stemgraph-web:
    image: dockerreg.gruppe.ai/stemgraph-web:1.0.0
    container_name: stemgraph-web
    expose:
      - "80"
    restart: unless-stopped
    networks:
      frontproxy_fnet:
        ipv4_address: 172.18.18.31
      backend:

networks:
  frontproxy_fnet:
    external: true
  backend:
    name: stemgraph-web_backend
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"