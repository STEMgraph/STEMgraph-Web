services:
  stemgraph-web:
    image: dockerreg.gruppe.ai/stemgraph-web:1.0.0
    container_name: stemgraph-web
    expose:
      - "80"
    restart: unless-stopped
    networks:
      frontproxy_fnet:
        ipv4_address: 172.18.18.31
      stemgraph-network:

  stemgraph-db:
    image: mariadb:11
    container_name: stemgraph-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      stemgraph-network:

networks:
  frontproxy_fnet:
    external: true
  stemgraph-network:
    external: true

volumes:
  db-data: