<!-- DARK MODE VERSION -->
<svg viewBox="0 0 120 148" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <!-- Kreis: NUR Outline, kein Fill -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#fff" stroke-width="4"/>

  <!-- edges - hell -->
  <g clip-path="url(#c)" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
    <line x1="56" y1="62" x2="20" y2="40"/>
    <line x1="56" y1="62" x2="100" y2="35"/>
    <line x1="56" y1="62" x2="92" y2="88"/>
    <line x1="56" y1="62" x2="30" y2="95"/>
    <line x1="56" y1="62" x2="78" y2="60"/>
    <line x1="56" y1="62" x2="60" y2="30"/>
  </g>

  <!-- nodes - hell, leicht größer für mehr Präsenz -->
  <g clip-path="url(#c)" fill="#fff">
    <circle cx="56" cy="62" r="4.5"/>
    <polygon points="20,33 27,47 13,47"/>
    <circle cx="100" cy="35" r="3.5"/>
    <rect x="87.5" y="83.5" width="7" height="7"/>
    <circle cx="30" cy="95" r="3.5"/>
    <circle cx="78" cy="60" r="3.5"/>
    <circle cx="60" cy="30" r="3.5"/>
  </g>

  <!-- wordmark -->
  <text x="60" y="133" fill="#fff" font-size="22" text-anchor="middle" 
        font-family="system-ui, sans-serif" font-weight="800" letter-spacing="0.1">
    STEMgraph
  </text>
</svg>
